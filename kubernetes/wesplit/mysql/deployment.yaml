apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mysql
  name: mysql
  namespace: wesplit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - image: mysql:latest
          name: mysql
          env:  #environment variables for the container 
            - name: MYSQL_ROOT_PASSWORD 
              valueFrom: #value can be fetched from a generic secret using its name and key
                #a secret is similar to a configmap but it's specifically used to store confidential data
                secretKeyRef:
                    name: mysql-password
                    key: password
            - name: MYSQL_DATABASE #name-value pair
              value: wesplit
          ports:
            - containerPort: 3306
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-data
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
