apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mealie
  name: mealie
  namespace: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - image: ghcr.io/mealie-recipes/mealie:v1.3.2
          name: mealie
          ports:
            - containerPort: 9000
          volumeMounts:
            - mountPath: /scratch 
              name: scratch-volume
      volumes:
        - name: scratch-volume
          emptyDir:
            sizeLimit: 500Mi


          
