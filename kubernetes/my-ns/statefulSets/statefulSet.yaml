apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: #serviceName must reference a Headless Service. It provides stable DNS identities to the pods.
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: registry.k8s.io/nginx-slim:0.21
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates: #template for the pvc created for each replica
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi

# A StatefulSet is used for deploying stateful applications.
# Each pod in a StatefulSet has it's own identity and own storage volume i.e. sticky identity and sticky storage. (web-0, web-1 etc.) 
# The pods in a StatefulSet are started and terminated in sequence.
# A StatefulSet can be tied to a headless service to make it's pods accessible through subdomains. (web-0.<headless-svc>)

