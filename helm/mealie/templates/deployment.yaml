apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }} 
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - image: "{{ .Values.image }}:{{ .Chart.AppVersion }}"
          name: {{ .Release.Name }}
          ports:
            - containerPort: 9000
          volumeMounts:
            - mountPath: /app/data 
              name: {{ .Release.Name }}-data
      volumes:
        - name: {{ .Release.Name }}-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data


          
